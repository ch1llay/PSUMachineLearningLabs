<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МО — интерактивный учебник к экзамену</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --text:#e2e8f0; --muted:#94a3b8;
    --accent:#38bdf8; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444; --border:#334155;
  }
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px}
  .panel2{background:var(--panel2);border:1px solid var(--border);border-radius:8px}
  .accent{color:var(--accent)}
  .muted{color:var(--muted)}
  .btn{background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:.15s}
  .btn:hover{background:#475569;border-color:var(--accent)}
  .btn-primary{background:var(--accent);color:#082f49;font-weight:600;border:none}
  .btn-primary:hover{background:#0ea5e9}
  .btn-good{background:var(--good);color:#052e1a;border:none}
  .btn-bad{background:var(--bad);color:#fff;border:none}
  .quiz-opt{display:block;width:100%;text-align:left;padding:10px 14px;margin:6px 0;background:#1e293b;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s}
  .quiz-opt:hover{background:#334155;border-color:var(--accent)}
  .quiz-opt.correct{background:rgba(34,197,94,0.18);border-color:var(--good)}
  .quiz-opt.wrong{background:rgba(239,68,68,0.18);border-color:var(--bad)}
  .quiz-opt.disabled{cursor:default;opacity:.85}
  .sidebar a{display:block;padding:6px 10px;border-radius:6px;color:var(--text);text-decoration:none;font-size:14px}
  .sidebar a:hover{background:var(--panel2)}
  .sidebar a.active{background:var(--accent);color:#082f49;font-weight:600}
  .sidebar a .ind{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:#475569}
  .sidebar a .ind.done{background:var(--good)}
  .sidebar a .ind.partial{background:var(--warn)}
  .sidebar a .ind.bad{background:var(--bad)}
  .progress-bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
  .progress-bar .fill{height:100%;background:var(--accent);transition:.3s}
  .formula{background:#0b1220;border:1px solid var(--border);padding:10px 14px;border-radius:8px;margin:6px 0;overflow-x:auto}
  .pitfall{padding:8px 12px;border-left:3px solid var(--warn);background:#1e293b;margin:6px 0;border-radius:0 6px 6px 0}
  .tldr{padding:14px;border-left:4px solid var(--accent);background:rgba(56,189,248,0.08);border-radius:0 8px 8px 0;font-size:16px}
  .intuition{padding:14px;border-left:4px solid #a78bfa;background:rgba(167,139,250,0.08);border-radius:0 8px 8px 0}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--panel2);color:var(--muted);margin-left:6px}
  .h-section{font-size:13px;letter-spacing:0.05em;color:var(--muted);text-transform:uppercase;margin-top:18px;margin-bottom:8px}
  details summary{cursor:pointer;list-style:none}
  details summary::-webkit-details-marker{display:none}
  .mermaid{background:#fff;padding:10px;border-radius:8px}
  .slider-wrap{display:flex;align-items:center;gap:12px;margin:8px 0}
  .slider-wrap input[type=range]{flex:1}
  .grid-eul{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:900px){.grid-eul{grid-template-columns:1fr}}
  kbd{background:#0b1220;padding:2px 6px;border-radius:4px;border:1px solid var(--border);font-size:12px}
  table.t{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
  table.t th,table.t td{border:1px solid var(--border);padding:6px 10px;text-align:left}
  table.t th{background:var(--panel2)}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;background:#0b1220;border:1px solid var(--border);font-size:12px;margin:2px}
  .pill.acc{background:rgba(56,189,248,0.18);border-color:var(--accent);color:var(--accent)}
  .scroll-hint{font-size:12px;color:var(--muted)}
  .stat-strong{font-size:24px;font-weight:700;color:var(--accent)}
  canvas{max-width:100%}
</style>
</head>
<body>
<header class="sticky top-0 z-30 panel" style="border-radius:0;border-left:none;border-right:none;border-top:none">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
    <div class="font-bold text-lg">📘 МО · экзамен</div>
    <div class="flex-1 max-w-md">
      <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>
      <div class="text-xs muted mt-1" id="progressText">0 из 41 тем пройдено</div>
    </div>
    <button class="btn" onclick="toggleSidebar()" id="sbToggle">📑 Темы</button>
    <button class="btn" onclick="weakMode()">🔁 Слабые места</button>
    <button class="btn" onclick="resetProgress()" title="Сбросить прогресс">↺</button>
  </div>
</header>

<div class="max-w-7xl mx-auto px-4 py-4 flex gap-4">
  <aside id="sidebar" class="sidebar panel p-3 sticky top-20 self-start" style="width:260px;max-height:calc(100vh - 100px);overflow-y:auto">
    <!-- наполняется JS -->
  </aside>
  <main id="main" class="flex-1 panel p-6" style="min-width:0">
    <!-- контент темы -->
  </main>
</div>

<script>
/* =========================================================
   ДАННЫЕ ВСЕХ ТЕМ
   ========================================================= */
const TOPICS = [
/* ===== БЛОК A. Введение ===== */
{
id:1, block:"A. Введение", title:"Структура ИИ и виды машинного обучения",
tldr:"AI ⊃ ML ⊃ ANN ⊃ Deep Learning. По наличию меток МО делится на supervised / unsupervised / reinforcement; типы задач — классификация, регрессия, кластеризация, понижение размерности.",
intuition:"AI — это всё про «компьютер делает умное». ML — особый подход: не пишем правила вручную, а даём примеры и алгоритм сам выводит закономерность. Глубокое обучение — частный случай ML, где модель — это многослойная нейросеть.",
viz:{type:"mermaid",code:`graph TD
A[Искусственный интеллект - AI]:::ai --> B[Машинное обучение - ML]:::ml
B --> C[Нейронные сети - ANN]:::ann
C --> D[Глубокое обучение - DL]:::dl
B --> E[Supervised<br/>классификация, регрессия]
B --> F[Unsupervised<br/>кластеризация, PCA]
B --> G[Reinforcement<br/>агент в среде]
classDef ai fill:#0ea5e9,color:#fff,stroke:#082f49
classDef ml fill:#a78bfa,color:#fff
classDef ann fill:#f59e0b,color:#000
classDef dl fill:#22c55e,color:#000`},
formulas:[
  {tex:"\\mathcal{D}=\\{(x_i,y_i)\\}_{i=1}^{N}",explain:"обучающая выборка — пары объект-метка"},
  {tex:"a:X\\to Y",explain:"гипотеза/модель — отображение вход → ответ"}
],
pitfalls:[
  "Не путай AI и ML: ML — один из подходов к построению AI, не синоним.",
  "Deep Learning — не отдельная дисциплина, это частный случай ML на глубоких нейросетях.",
  "Supervised ≠ всегда классификация: бывает регрессия, ранжирование и пр."
],
quiz:[
  {q:"Какой тип обучения использует только данные без меток?",opt:["Supervised","Unsupervised","Reinforcement","Self-supervised"],correct:1,explain:"Unsupervised работает только с x_i — задачи кластеризации, PCA, аномалии."},
  {q:"К какой задаче относится прогноз цены квартиры (число)?",opt:["Классификация","Регрессия","Кластеризация","Понижение размерности"],correct:1,explain:"Цена — действительное число, значит регрессия."},
  {q:"Reinforcement learning — это…",opt:["обучение по парам (x,y)","агент в среде, оптимизирующий награду","перенос знаний","автоматическая разметка"],correct:1,explain:"RL — агент получает награду от среды и максимизирует суммарный reward."},
  {q:"Что НЕ является задачей unsupervised?",opt:["Кластеризация","Понижение размерности","Обнаружение аномалий","Классификация писем как спам/не спам"],correct:3,explain:"Спам/не спам — есть метки, это supervised classification."}
]
},
{
id:2, block:"A. Введение", title:"Постановка МО, риск, переобучение",
tldr:"Минимизируем эмпирический риск Q (среднюю потерю на train), но цель — малый истинный риск R на новых данных. Зазор между ними — переобучение.",
intuition:"Учим модель = подгоняем параметры под train. Но train — лишь конечный кусочек реальности. Если модель «зазубрила» train вместе с шумом, на новых данных она провалится. Bias-variance — фундаментальный компромисс: слишком простая модель недообучается (bias), слишком сложная переобучается (variance).",
viz:{type:"chart",chartType:"biasVariance"},
formulas:[
  {tex:"Q(a,X^\\ell)=\\frac{1}{\\ell}\\sum_{i=1}^{\\ell}\\mathcal{L}(y_i,a(x_i))",explain:"эмпирический риск — среднее loss по train"},
  {tex:"R(\\theta)=\\mathbb{E}_{(x,y)}[\\mathcal{L}(y,a(x))]",explain:"истинный риск — средняя потеря по всему распределению; именно он нас интересует"},
  {tex:"\\mathbb{E}[(y-\\hat f)^2]=\\text{Bias}^2+\\text{Variance}+\\sigma^2",explain:"разложение MSE: смещение² + разброс + неустранимый шум"}
],
pitfalls:[
  "Низкий train-loss ≠ хорошая модель. Только test показывает обобщение.",
  "Регуляризация — про bias-variance trade-off, а не «чтобы сошлось».",
  "Не подсматривай в test до финала, иначе test превратится в val.",
  "Слишком простая модель не лечится бóльшим количеством данных."
],
quiz:[
  {q:"Train-loss=0.01, test-loss=0.5. Что это?",opt:["Недообучение","Переобучение","Идеальная модель","Утечка данных"],correct:1,explain:"Огромный gap train↔test — классический overfitting."},
  {q:"Что снижает variance?",opt:["Усложнение модели","Регуляризация и больше данных","Удаление train","Уменьшение валидации"],correct:1,explain:"L2/L1, ансамбли, dropout, аугментация — всё против variance."},
  {q:"Bias — это…",opt:["разброс предсказаний","систематическая ошибка модели","шум в данных","ошибка валидации"],correct:1,explain:"Bias — насколько ожидание предсказания отличается от истины."},
  {q:"Что есть истинный (ожидаемый) риск?",opt:["loss на train","loss на test","матожидание потери по всему распределению","loss на одной точке"],correct:2,explain:"R(θ)=E[L] по совместному распределению (x,y)."}
]
},

/* ===== БЛОК B. Подготовка данных ===== */
{
id:3, block:"B. Подготовка данных", title:"Pipeline подготовки данных",
tldr:"Подготовка = последовательность преобразований сырых данных в формат для модели: импьютация → очистка → кодирование → масштабирование → отбор/PCA → балансировка. Занимает 60–80% времени проекта.",
intuition:"Думай как о готовке: сначала помыть и порезать, потом приправить, и только потом — на сковороду. Если перемешать порядок, модель «отравится». Главное правило кухни — fit только на train (узнаём приправы по обучающей выборке и применяем те же ко всем остальным).",
viz:{type:"mermaid",code:`graph LR
A[Raw data]:::r --> B[EDA]:::e
B --> C[Impute<br/>пропуски]:::s
C --> D[Clean<br/>дубли, выбросы]:::s
D --> E[Encode<br/>категории]:::s
E --> F[Scale<br/>масштаб]:::s
F --> G[Select / PCA]:::s
G --> H[Balance]:::s
H --> I[Train/Val/Test]:::r
I --> J[Model]:::m
classDef r fill:#0ea5e9,color:#fff
classDef e fill:#a78bfa,color:#fff
classDef s fill:#f59e0b,color:#000
classDef m fill:#22c55e,color:#000`},
formulas:[
  {tex:"\\mu_{train},\\sigma_{train}\\;\\to\\;\\text{transform}(X_{val}, X_{test})",explain:"параметры считаются ТОЛЬКО на train, применяются ко всем"}
],
pitfalls:[
  "Самая частая ошибка — fit на всём датасете до train/test split. Это утечка (data leakage), оценка качества будет завышена.",
  "ColumnTransformer + Pipeline (sklearn) гарантируют корректный порядок и отсутствие утечки.",
  "Забыть применить те же преобразования к production-данным — ошибка инфраструктуры.",
  "Балансировку (SMOTE) делают после split на train, иначе синтетические объекты «утекут» в test."
],
quiz:[
  {q:"На каких данных fit-ить StandardScaler?",opt:["На всём датасете","Только на train","На train+val","На test"],correct:1,explain:"fit на train, transform на train/val/test — иначе data leakage."},
  {q:"Что НЕ относится к подготовке данных?",opt:["Импьютация","Кодирование","Backpropagation","PCA"],correct:2,explain:"Backprop — это уже обучение нейросети, не подготовка."},
  {q:"Почему так важен правильный pipeline?",opt:["Быстрее работает","Воспроизводимость и отсутствие утечек","Меньше памяти","Лучше визуализация"],correct:1,explain:"Главные цели — reproducibility и недопущение утечек."}
]
},
{
id:4, block:"B. Подготовка данных", title:"Заполнение пропусков (imputation)",
tldr:"Пропуски либо удаляют (если их мало и они MCAR), либо заполняют статистикой по столбцу (mean/median/mode), kNN-импьютером или итеративной моделью (MICE). Часто добавляют флаг is_missing.",
intuition:"Пропуск — не «ничего», а информация. Иногда сам факт пропуска — сильный признак (богатые не пишут доход → MNAR). Поэтому два инструмента: заполнить значением + добавить колонку-флажок.",
viz:{type:"mermaid",code:`graph TD
A[Пропуск в данных] --> B{Механизм?}
B -->|MCAR<br/>совершенно случайно| C[Удалить или mean/median]
B -->|MAR<br/>зависит от наблюдаемых| D[KNNImputer / MICE]
B -->|MNAR<br/>зависит от самого пропуска| E[Спец. модели + флаг]
C --> F[+ колонка is_missing]
D --> F
E --> F`},
formulas:[
  {tex:"\\hat x_{ij}=\\frac{1}{k}\\sum_{m\\in N_k(i)} x_{mj}",explain:"KNN-импьютер: пропуск j-го признака — среднее по k ближайшим объектам"}
],
pitfalls:[
  "Среднее снижает дисперсию признака — корреляции искажаются.",
  "Mode для редкой категории раздувает её долю.",
  "Никогда не fit на всей выборке до split.",
  "KNNImputer чувствителен к масштабу — масштабируй сначала, потом импьютируй (или наоборот, согласованно).",
  "Перед удалением строк проверь, не теряешь ли всю информацию о редком классе."
],
quiz:[
  {q:"Распределение скошенное, есть выбросы — чем заполнять?",opt:["Mean","Median","Mode","Нулём"],correct:1,explain:"Median устойчива к выбросам в отличие от mean."},
  {q:"MNAR — это…",opt:["абсолютно случайные пропуски","зависят только от наблюдаемых признаков","зависят от самого пропущенного значения","вообще нет пропусков"],correct:2,explain:"MNAR = Missing Not At Random: пропуск зависит от того, что было бы записано."},
  {q:"Зачем добавлять колонку is_missing?",opt:["Ускоряет обучение","Сохраняет факт пропуска как признак","Уменьшает размерность","Удаляет шум"],correct:1,explain:"Сам факт пропуска часто несёт информацию."},
  {q:"Какой импьютер лучше при MAR и сложных зависимостях?",opt:["Mean","Constant=0","IterativeImputer (MICE)","drop"],correct:2,explain:"MICE моделирует каждый признак функцией остальных — учитывает зависимости."}
]
},
{
id:5, block:"B. Подготовка данных", title:"Очистка данных",
tldr:"Очистка = дубли → форматы → типы → выбросы → опечатки → редкие категории. Для выбросов — boxplot/IQR, 3σ, z-score, IsolationForest, DBSCAN. Не всегда удаляют: иногда выбросы — сама цель (фрод).",
intuition:"Выброс — это не «ошибка», а «нетипичное наблюдение». Сначала пойми, почему оно нетипично, и только потом решай: удалять, винзоризовать, логарифмировать или оставить.",
viz:{type:"chart",chartType:"iqrBox"},
formulas:[
  {tex:"\\text{IQR}=Q_3-Q_1",explain:"межквартильный размах"},
  {tex:"x<Q_1-1.5\\,\\text{IQR}\\;\\text{или}\\;x>Q_3+1.5\\,\\text{IQR}\\Rightarrow\\text{выброс}",explain:"правило Тьюки"},
  {tex:"|z|=|x-\\mu|/\\sigma>3\\Rightarrow\\text{выброс}",explain:"z-score: только при примерно нормальном распределении"}
],
pitfalls:[
  "3σ для скошенных распределений (например, доход) объявит почти всё справа выбросами.",
  "Удалять выбросы на test — это data leakage.",
  "Очистка должна быть скриптом, не «я посмотрел и удалил».",
  "Для робастности используй RobustScaler / MAE вместо MSE — иногда лучше не трогать выбросы, а сделать модель устойчивее.",
  "Не путай выброс и редкое, но валидное значение."
],
quiz:[
  {q:"IQR это…",opt:["Q3-Q1","Q3-min","max-min","2σ"],correct:0,explain:"Межквартильный размах = Q3 − Q1."},
  {q:"3σ-правило плохо работает при…",opt:["нормальном распределении","сильно скошенных распределениях","большой выборке","малой дисперсии"],correct:1,explain:"При скошенности 3σ-граница не симметрична относительно «массы» данных."},
  {q:"Winsorization — это…",opt:["логарифмирование","замена выброса на граничное значение","удаление выброса","z-score"],correct:1,explain:"Винзоризация = clip к [Q1-1.5IQR, Q3+1.5IQR] или к перцентилям."},
  {q:"В задаче обнаружения мошенничества выбросы…",opt:["надо удалить","и есть цель — их и ищем","заменить медианой","масштабировать"],correct:1,explain:"Фрод = редкое отклонение от нормы, удалять его — потерять задачу."}
]
},
{
id:6, block:"B. Подготовка данных", title:"Кодирование качественных признаков",
tldr:"Алгоритмы работают с числами. Порядковые → Ordinal. Номинальные с малым числом категорий → OneHot. Много категорий → Target/Frequency или Embeddings. Target encoding обязательно делать out-of-fold.",
intuition:"Номинальные категории не имеют порядка («Москва», «Берлин», «Токио»). Если закодировать их 0/1/2, модель решит, что Берлин «между» Москвой и Токио. OneHot убирает эту фантомную упорядоченность за счёт лишних колонок.",
viz:{type:"html",code:`
<div class="grid-eul">
<div class="panel2 p-3">
<div class="font-medium mb-2">OneHot</div>
<table class="t"><tr><th>Cat</th><th>red</th><th>green</th><th>blue</th></tr>
<tr><td>red</td><td>1</td><td>0</td><td>0</td></tr>

intuition:"Меньше признаков → меньше переобучения, быстрее обучение, проще интерпретация. Цель — выкинуть шум и дубли, оставить сигнал. Filter — оценивает каждый признак сам по себе. Wrapper — перебирает наборы. Embedded — модель сама указывает важных.",

tldr:"Скоррелированные признаки → мультиколлинеарность → нестабильные коэффициенты в линейке, дублируется информация, медленная сходимость. Лечится удалением одного из пары, PCA, whitening или Ridge-регуляризацией.",
intuition:"Если у тебя «вес в кг» и «вес в фунтах» — это один и тот же признак. Линейка не знает, какому коэффициенту верить, и сходит с ума. Декорреляция — сделать признаки «ортогональными» в информационном смысле.",

id:10, block:"B. Подготовка данных", title:"PCA — главные компоненты",
tldr:"PCA проецирует данные на k ортогональных осей с максимальной дисперсией. Это и понижение размерности, и декорреляция, и подавление шума. Эквивалентно SVD центрированной матрицы.",
intuition:"Облако точек вытянуто вдоль некоторого направления — оно и есть первая главная компонента. Проекция теряет минимум информации, потому что вдоль PC1 разброс максимален. Так и с PC2 ⊥ PC1, и т.д.",

id:11, block:"B. Подготовка данных", title:"Аугментация и сэмплинг",
tldr:"При дисбалансе классов — undersampling (выкинуть мажор), oversampling (продублировать минор), SMOTE (синтетические интерполяции в minor классе), class_weight (взвешивание loss). Аугментация — расширение train (повороты, шум, парафраз) для борьбы с переобучением.",
intuition:"Если 99% — норма и 1% — фрод, accuracy 99% даёт даже модель «всегда норма». Нужно либо балансировать выборку, либо считать loss с весами, либо менять метрику. Аугментация — другая история: создаём новые сэмплы из имеющихся, чтобы модель видела вариативность.",

id:12, block:"C. Регрессия", title:"Линейная регрессия и МНК",
tldr:"Модель ŷ = w·x + b. МНК минимизирует сумму квадратов ошибок Q = ‖y − Xw‖². Решение в закрытой форме ŵ = (XᵀX)⁻¹Xᵀy (если XᵀX невырожденная), иначе через псевдообращение.",
intuition:"Прямая, минимизирующая сумму квадратов вертикальных расстояний от точек. Квадраты — потому что: симметрия, гладкая (диффренцируема), штрафует большие ошибки сильнее малых, статистически — MLE при гауссовом шуме.",
viz:{type:"chart",chartType:"linregFit"},
formulas:[
  {tex:"Q(w)=\\frac{1}{N}\\|y-Xw\\|^2",explain:"квадратичный функционал"},
  {tex:"\\nabla_w Q=\\frac{2}{N}X^\\top(Xw-y)=0",explain:"градиент → нормальное уравнение"},
  {tex:"\\hat w=(X^\\top X)^{-1}X^\\top y",explain:"закрытое решение"}
],
pitfalls:[
  "Если признаки коррелированы — XᵀX почти вырождена, веса нестабильны → используй Ridge или SVD.",
  "Не забудь добавить столбец единиц для bias, либо центрируй y.",
  "Линейная регрессия чувствительна к выбросам (квадрат штрафует сильно) — иногда нужна Huber или MAE.",
  "Гомоскедастичность шума — предположение OLS; нарушение → доверительные интервалы неправильны."
],
quiz:[
  {q:"Что минимизирует МНК?",opt:["Сумму ошибок","Сумму |ошибок|","Сумму квадратов ошибок","Максимум ошибки"],correct:2,explain:"Q=Σ(y−ŷ)²."},
  {q:"Когда не работает (XᵀX)⁻¹?",opt:["Малая N","XᵀX вырождена / коллинеарность","Большой шум","Бинарные признаки"],correct:1,explain:"При коллинеарности XᵀX сингулярна — нужен Ridge или псевдообращение."},
  {q:"При гауссовом шуме МНК = …",opt:["MAP","MLE","Bayes","ничего особенного"],correct:1,explain:"OLS — это maximum likelihood при ε~N(0,σ²)."},
  {q:"Линейная регрессия чувствительна к выбросам потому что…",opt:["использует абс. значения","квадрат сильно штрафует","нет регуляризации","большая размерность"],correct:1,explain:"Большая ошибка → её квадрат «утягивает» прямую."}
]
},

id:13, block:"C. Регрессия", title:"Метрики качества регрессии",
tldr:"MSE/RMSE — стандарт, штрафуют большие ошибки сильнее. MAE — устойчив к выбросам. MAPE — в процентах (но взрывается при y≈0). R² ∈ (−∞,1] — доля объяснённой дисперсии (R²<0 значит модель хуже среднего).",
intuition:"R² = 1 − (наша ошибка) / (ошибка модели «всегда среднее»). 1 = идеально, 0 = не лучше среднего, <0 = катастрофа. RMSE и MAE — в единицах целевой переменной, удобны для бизнес-интерпретации.",
viz:{type:"chart",chartType:"r2Demo"},
formulas:[
  {tex:"\\text{MSE}=\\tfrac{1}{N}\\sum(y_i-\\hat y_i)^2,\\;\\text{RMSE}=\\sqrt{\\text{MSE}}",explain:"квадратичная ошибка"},
  {tex:"\\text{MAE}=\\tfrac{1}{N}\\sum|y_i-\\hat y_i|",explain:"абсолютная — устойчива к выбросам"},
  {tex:"R^2=1-\\frac{\\sum(y_i-\\hat y_i)^2}{\\sum(y_i-\\bar y)^2}",explain:"доля объяснённой дисперсии"},
  {tex:"R^2_{\\text{adj}}=1-(1-R^2)\\frac{N-1}{N-d-1}",explain:"adjusted — штрафует за лишние признаки"}
],
pitfalls:[
  "MAPE взрывается при y близких к 0; используй sMAPE или MAE.",

  "RMSE сравнивай только в одних и тех же единицах.",

  {q:"Какая метрика устойчива к выбросам?",opt:["MSE","MAE","RMSE","R²"],correct:1,explain:"MAE линейна — большие ошибки не возводятся в квадрат."},

]

id:14, block:"C. Регрессия", title:"Регуляризация: Ridge, Lasso, Elastic Net",
tldr:"Добавляем штраф за веса: Ridge — λ‖w‖² (плавно уменьшает все), Lasso — λ‖w‖₁ (зануляет неважные → отбор), Elastic Net — комбинация. λ — гиперпараметр, подбирается CV.",
intuition:"Без регуляризации модель может «переборщить» с большими весами на коррелированных признаках. Ridge — мягко тянет всё к нулю. Lasso — за счёт геометрии ромба углы попадают на оси, поэтому одни веса становятся ровно нулём. Elastic — компромисс.",
viz:{type:"chart",chartType:"l1l2"},
formulas:[
  {tex:"\\text{Ridge: }\\hat w=(X^\\top X+\\lambda I)^{-1}X^\\top y",explain:"закрытое решение, всегда обратимо"},
  {tex:"\\text{Lasso: }\\min_w \\|y-Xw\\|^2+\\lambda\\|w\\|_1",explain:"нет closed-form; координатный спуск"},
  {tex:"\\text{Elastic: }\\lambda_1\\|w\\|_1+\\lambda_2\\|w\\|_2^2",explain:"L1 + L2"}
],
pitfalls:[
  "Регуляризация требует масштабирования — иначе штрафуются «крупные по числу» признаки.",
  "Lasso при сильно коррелированных признаках выбирает один и обнуляет остальных — иногда «случайным» образом.",
  "λ слишком большой → underfitting; слишком маленький → нет эффекта.",
  "Bias не штрафуй (sklearn делает это автоматически)."
],
quiz:[
  {q:"Какая регуляризация даёт разреженность (точные нули)?",opt:["Ridge","Lasso","Ни одна","Обе"],correct:1,explain:"L1 имеет острые углы на осях → решения ложатся на них."},
  {q:"Ridge при коллинеарности…",opt:["проваливается","стабилизирует, делая XᵀX+λI обратимой","хуже OLS","зависит от данных"],correct:1,explain:"+λI делает матрицу хорошо обусловленной."},
  {q:"λ растёт — что происходит с весами?",opt:["растут","→ к нулю","не меняются","становятся отрицательными"],correct:1,explain:"Чем больше штраф, тем сильнее веса прижимаются к нулю."},
  {q:"Elastic Net лучше Lasso когда…",opt:["мало признаков","группы коррелированных признаков","нет шума","много шума"],correct:1,explain:"L2-часть «делит» вес между скоррелированными, L1 — отбирает."}
]
},
{
id:15, block:"C. Регрессия", title:"Логистическая регрессия",
tldr:"Линейная модель + сигмоида = вероятность класса. Минимизируем бинарную кросс-энтропию (BCE / log-loss). Многоклассовая — softmax + cross-entropy.",
intuition:"Логистическая регрессия — это не «регрессия», а классификация. Линейная функция w·x+b проходит через сигмоиду, выдавая P(y=1|x) ∈ [0,1]. Граница решения — гиперплоскость w·x+b=0.",
viz:{type:"chart",chartType:"sigmoid"},
formulas:[
  {tex:"\\sigma(z)=\\frac{1}{1+e^{-z}},\\;\\sigma'(z)=\\sigma(z)(1-\\sigma(z))",explain:"сигмоида"},
  {tex:"p(y=1|x)=\\sigma(w^\\top x+b)",explain:"вероятность положительного класса"},
  {tex:"Q=-\\tfrac{1}{N}\\sum[y_i\\log\\hat p_i+(1-y_i)\\log(1-\\hat p_i)]",explain:"BCE / log-loss"},
  {tex:"\\nabla_w Q=\\tfrac{1}{N}X^\\top(\\hat p-y)",explain:"градиент — красивый и удобный"}
],
pitfalls:[
  "Не путай с линейной регрессией: ответ — вероятность, не число.",
  "Класс предсказывается через threshold (по умолчанию 0.5), но его можно сдвигать ради recall/precision.",
  "Сильно несбалансированные классы → используй class_weight или меняй threshold.",
  "Для многих классов — softmax + cross-entropy."
],
quiz:[
  {q:"σ(z) пробегает значения в …",opt:["[−1,1]","[0,1]","ℝ","[0,∞)"],correct:1,explain:"Сигмоида ограничена (0,1), отсюда вероятность."},
  {q:"Какой loss для логистической?",opt:["MSE","Hinge","Cross-entropy / log-loss","MAE"],correct:2,explain:"BCE = MLE при Бернулли."},
  {q:"σ′(z) =",opt:["σ(z)","σ(z)(1−σ(z))","1−σ(z)","z·σ(z)"],correct:1,explain:"Удобное свойство для backprop."},
  {q:"Многоклассовая логистическая — это…",opt:["несколько one-vs-rest","softmax + cross-entropy","Naive Bayes","SVM"],correct:1,explain:"Softmax даёт вероятности по K классам."}
]
},
{
id:16, block:"C. Регрессия", title:"Нелинейная регрессия",
tldr:"Когда зависимость y от x явно не прямая — используем: полиномиальные признаки, базисные функции (RBF, сплайны), kernel-методы (SVR с ядром), деревья, нейросети. Главный риск — переобучение при высокой степени полинома.",
intuition:"Линейная регрессия линейна по w, не по x. Если добавить признаки x², x³, sin(x), ln(x) — это всё ещё линейная регрессия (по новым признакам), но кривая на исходной оси. Деревья и нейросети — иной механизм нелинейности.",
viz:{type:"chart",chartType:"polyOverfit"},
formulas:[
  {tex:"\\hat y=w_0+w_1 x+w_2 x^2+\\dots+w_p x^p",explain:"полиномиальная регрессия степени p"},
  {tex:"\\hat y=\\sum_k w_k\\phi_k(x)",explain:"общая модель с базисными функциями φ_k"}
],
pitfalls:[
  "Высокая степень полинома → дикое переобучение, осцилляции на краях (Runge).",
  "Полиномы степени >5–7 редко бывают полезны — используй сплайны или регуляризацию.",
  "Перед полиномиальными признаками масштабируй вход.",
  "Извлечь интерпретируемость из нелинейных моделей сложнее — иногда лучше простая модель."
],
quiz:[
  {q:"Полиномиальная регрессия 1-й степени — это…",opt:["константа","обычная линейная","кубическая","квадратичная"],correct:1,explain:"degree=1 = линейная регрессия."},
  {q:"degree=15, мало точек — что произойдёт?",opt:["идеальный fit","переобучение, осцилляции на краях","ошибка","ускорение"],correct:1,explain:"Высокая степень + мало данных = классический overfitting."},
  {q:"Базисные функции (RBF, сплайны) — это…",opt:["типы регуляризации","нелинейные преобразования входа","оптимизаторы","метрики"],correct:1,explain:"Они расширяют пространство признаков, оставляя модель линейной по w."}
]

{
id:17, block:"D. Классификация и кластеризация", title:"Теорема Байеса",
tldr:"P(y|x) = P(x|y)·P(y) / P(x). Апостериор ∝ правдоподобие × априор. На этом построен байесовский классификатор: arg max P(c)·P(x|c).",
intuition:"До эксперимента у тебя априор P(y) — то, что ты «верил». После эксперимента (увидел x) — апостериор P(y|x). Чем больше данных, тем меньше влияет априор. Классический пример: тест на болезнь с false-positive rate.",
viz:{type:"mermaid",code:`graph LR
A[Априор<br/>P y] --> P[Апостериор<br/>P y x]
B[Правдоподобие<br/>P x y] --> P
C[Маргинал<br/>P x] --> P
P --> D[Решение:<br/>argmax P c P x c]`},
formulas:[
  {tex:"P(y|x)=\\frac{P(x|y)P(y)}{P(x)}",explain:"теорема Байеса"},
  {tex:"\\hat y=\\arg\\max_c P(c)\\,P(x|c)",explain:"знаменатель P(x) одинаков — игнорируем"}
],
pitfalls:[
  "При редком классе P(y) маленький, и даже сильное правдоподобие не «перевешивает» — нужны корректные априоры.",
  "Численная устойчивость: складывай log-вероятности, не перемножай.",
  "Полная P(x|c) для сложных x требует много параметров — отсюда «наивный» байес."
],
quiz:[
  {q:"P(y|x) ∝ …",opt:["P(x)·P(y)","P(x|y)·P(y)","P(x|y)·P(x)","P(y|x)"],correct:1,explain:"Числитель: правдоподобие × априор."},
  {q:"Зачем игнорируем P(x) при argmax?",opt:["оно нулевое","одинаково для всех классов","всегда 1","трудно посчитать"],correct:1,explain:"Не зависит от c — не влияет на argmax."},
  {q:"Тест: P(пол.|болен)=0.99, P(пол.|здоров)=0.05, P(болен)=0.001. Доминирует…",opt:["правдоподобие","априор","маргинал","ничего"],correct:1,explain:"Очень малый априор «убивает» апостериор — почти все позитивные тесты ложные."}
]
},
{
id:18, block:"D. Классификация и кластеризация", title:"Наивный Байес",
tldr:"Предположение «наивности»: признаки условно независимы при заданном классе → P(x|c) = ∏P(x_j|c). Простой, быстрый, хорошо для текстов. Виды: Гауссовский, Мультиномиальный, Бернуллиевский. Лапласово сглаживание против нулей.",
intuition:"Условная независимость признаков почти никогда не выполняется. Но даже при нарушении NB удивительно хорошо классифицирует — потому что для argmax нам нужна правильная относительная разница вероятностей, а не точные значения.",
viz:{type:"mermaid",code:`graph TD
A[x = слова в письме] --> B[P spam x prod P w_i spam]
A --> C[P ham x prod P w_i ham]
B --> D{argmax}
C --> D
D --> E[класс]`},
formulas:[
  {tex:"P(x|c)\\approx\\prod_j P(x_j|c)",explain:"наивное предположение"},
  {tex:"\\hat p_{jc}=\\frac{n_{jc}+\\alpha}{n_c+\\alpha V}",explain:"Лапласово сглаживание (α=1)"},
  {tex:"P(x_j|c)=\\mathcal{N}(x_j;\\mu_{jc},\\sigma_{jc}^2)",explain:"Гауссовский NB для непрерывных признаков"}
],
pitfalls:[
  "Без сглаживания одно отсутствующее слово в классе → P(x|c)=0 → катастрофа.",
  "NB даёт плохо калиброванные вероятности — но классы предсказывает часто хорошо.",
  "Корреляция признаков нарушает «наивность» — на классификацию влияет умеренно, на P(y|x) — сильно.",
  "Логарифмируй: складывай logP, не перемножай."
],
quiz:[
  {q:"«Наивность» — это…",opt:["простая реализация","условная независимость признаков","нет регуляризации","байесовость"],correct:1,explain:"P(x|c) = ∏P(x_j|c)."},
  {q:"Зачем Лапласово сглаживание?",opt:["скорость","избежать P=0 для редких слов","точность","масштабирование"],correct:1,explain:"Иначе одно неизвестное слово обнуляет всё произведение."},
  {q:"Гауссовский NB подходит для…",opt:["текстов","количественных признаков","изображений","временных рядов"],correct:1,explain:"Моделирует P(x_j|c) как нормальное распределение."},
  {q:"Мультиномиальный NB — стандарт для…",opt:["NLP / bag-of-words","изображений","сенсоров","табличных смешанных"],correct:0,explain:"Хорошо считает счётчики слов."}
]
},
{
id:19, block:"D. Классификация и кластеризация", title:"k-NN — ближайшие соседи",
tldr:"Ленивый алгоритм: запоминает train, на запросе ищет k ближайших соседей и голосует (или усредняет для регрессии). Гиперпараметры — k, метрика, веса. Классическое k ≈ √N.",
intuition:"«Скажи, кто твой сосед, и я скажу, кто ты». Маленькое k — изломанная граница, переобучение. Большое k — гладкая, но размытая. Метрика выбирается под природу данных: евклидова для физических координат, косинусная для текстов.",
viz:{type:"chart",chartType:"knnDecision"},
formulas:[
  {tex:"\\hat y(x)=\\arg\\max_c\\sum_{i\\in N_k(x)} w_i\\mathbb{1}[y_i=c]",explain:"взвешенное голосование соседей"},
  {tex:"w_i=1\\;\\text{(uniform)}\\;\\text{или}\\;w_i=1/d(x,x_i)\\;\\text{(distance)}",explain:"веса соседей"},
  {tex:"\\hat y=\\frac{\\sum w_i y_i}{\\sum w_i}",explain:"для регрессии — средневзвешенное"}
],
pitfalls:[
  "Чувствителен к масштабу — обязательно scaling.",
  "Проклятие размерности: при большом d все точки одинаково «далеко».",
  "Медленный inference: O(N·d) на запрос; для больших N — KD-tree, Ball-tree, ANN.",

],
quiz:[

  {q:"Перед kNN обязательно…",opt:["обучить веса","масштабировать","факторизовать","поделить на k"],correct:1,explain:"kNN основан на расстояниях — масштаб критичен."},
  {q:"k → ∞ — модель…",opt:["переобучается","становится константной (мажоритарный класс)","быстрее","лучше"],correct:1,explain:"При k=N все запросы дают мажоритарный класс."},
  {q:"Косинусная метрика хороша для…",opt:["изображений","текстов / TF-IDF","временных рядов","сенсоров"],correct:1,explain:"Для разреженных длинно-разноразмерных векторов важно направление, не модуль."}
]
},
{
id:20, block:"D. Классификация и кластеризация", title:"Деревья решений: понятие",
tldr:"Бинарное дерево, в каждой внутренней вершине — условие на признак (x_j ≤ τ), в листе — предсказание (класс или число). Жадно строится сверху вниз по критериям Gini/entropy/MSE.",
intuition:"Пошаговый набор if-else, каждый шаг разбивает данные на «более чистые» подгруппы. Интерпретируемо как блок-схема. Слабый ученик в одиночку, но идеальная база для ансамблей (RF, GBM).",

formulas:[
  {tex:"\\text{Gini}(S)=1-\\sum_c p_c^2",explain:"мера неоднородности (0 = чистый узел)"},
  {tex:"\\text{Entropy}(S)=-\\sum_c p_c\\log_2 p_c",explain:"альтернативный критерий"},
  {tex:"\\text{IG}(S,A)=H(S)-\\sum_v\\tfrac{|S_v|}{|S|}H(S_v)",explain:"Information Gain — то, что максимизируем"}
],
pitfalls:[

  "Линейные зависимости плохо ловят (нужна лестница).",

],

  {q:"Какой критерий жадно максимизируется при разбиении?",opt:["Loss","Information Gain","Accuracy","Бутстрэп"],correct:1,explain:"Уменьшение примеси (entropy/Gini) максимально."},

]

intuition:"Жадный нисходящий алгоритм — на каждом шаге выбираем «лучшее здесь и сейчас» разбиение, не заглядывая вперёд. Поэтому глобально может проиграть, зато быстро. Алгоритмы: ID3 (entropy), C4.5, CART (Gini, бинарные деревья).",

tldr:"Pre-pruning: ограничения при росте (max_depth, min_samples_leaf, max_leaf_nodes, min_impurity_decrease). Post-pruning: cost-complexity (α-pruning) — удаляем поддеревья, минимизируя Q(T)+α·|T|.",
intuition:"Без ограничений дерево вырастет до отдельного листа на каждый объект — train-loss=0, test-loss катастрофа. Регуляризация = «не даём расти слишком глубоко» (pre) или «срезаем лишнее» (post).",
viz:{type:"chart",chartType:"depthOverfit"},
formulas:[
  {tex:"C_\\alpha(T)=\\sum_{t\\in\\text{leaves}}Q(t)+\\alpha|T|",explain:"cost-complexity: качество + штраф за число листьев"}
],
pitfalls:[
  "max_depth=None → переобучение почти гарантировано.",
  "Слишком жёсткие ограничения → underfitting.",
  "α в pruning подбирается CV.",
  "В sklearn ccp_alpha делает post-pruning."
],
quiz:[
  {q:"max_depth ↑ → bias и variance…",opt:["оба ↑","оба ↓","bias ↓, variance ↑","bias ↑, variance ↓"],correct:2,explain:"Глубже — гибче (меньше bias), но и сильнее переобучается."},
  {q:"Cost-Complexity Pruning штрафует за…",opt:["глубину","число листьев","скорость","accuracy"],correct:1,explain:"|T| — число листьев."},
  {q:"Pre-pruning vs post-pruning?",opt:["ограничения при росте дерева vs обрезка после полного построения","до и после inference","до и после feature selection","два названия одного"],correct:0,explain:"Pre — не даёт расти (max_depth и пр.); post — режет уже выросшее (ccp_alpha)."},
  {q:"min_samples_leaf=1 — это…",opt:["осторожно","экстремально мягкое ограничение → переобучение","надёжно","оптимально"],correct:1,explain:"Каждый объект может оказаться отдельным листом."}
]
},
{
id:23, block:"D. Классификация и кластеризация", title:"SVM — метод опорных векторов",
tldr:"Ищем гиперплоскость с максимальным зазором между классами. Зазор = 2/‖w‖. Мягкий зазор: ‖w‖² + C·Σξ_i (C — компромисс зазор/ошибки). Ядро (kernel trick) — нелинейная граница без явного перехода в высокую размерность.",
intuition:"Двух точек хватит, чтобы провести прямую — но мы хотим прямую, у которой больше всего «места» с обеих сторон. Только опорные вектора (точки на границе зазора) определяют решение. Ядро — способ работать в нелинейном пространстве, считая только скалярные произведения.",
viz:{type:"chart",chartType:"svmMargin"},
formulas:[
  {tex:"\\min\\tfrac{1}{2}\\|w\\|^2+C\\sum\\xi_i,\\;y_i(w^\\top x_i+b)\\ge 1-\\xi_i",explain:"мягкий зазор — оптимизация"},
  {tex:"\\mathcal{L}=\\max(0,1-y_i(w^\\top x_i+b))",explain:"hinge loss"},
  {tex:"K(x,y)=\\exp(-\\gamma\\|x-y\\|^2)",explain:"RBF-ядро — самое популярное"},
  {tex:"\\hat y(x)=\\text{sign}\\big(\\sum_i\\alpha_i y_i K(x_i,x)+b\\big)",explain:"предсказание через ядра"}
],
pitfalls:[
  "Чувствителен к масштабу — обязательно scaling.",
  "C большой → жёсткий зазор, переобучение; C маленький → мягкий, недообучение.",
  "γ в RBF: большой γ — узкие шары вокруг точек (переобучение), маленький — почти линейный.",
  "На больших датасетах (>100k) — медленный, бери LinearSVM."
],
quiz:[
  {q:"Зазор у SVM — это…",opt:["1/‖w‖","2/‖w‖","‖w‖","‖w‖²"],correct:1,explain:"Margin = 2/‖w‖, поэтому минимизируем ‖w‖²."},
  {q:"Большой C — это…",opt:["мягкий зазор","жёсткий зазор → переобучение","больше регуляризации","меньше точек"],correct:1,explain:"Большой штраф за нарушения = жёсткий margin."},
  {q:"Опорные вектора — это…",opt:["центры кластеров","точки на/в зазоре","выбросы","любые точки"],correct:1,explain:"Только они влияют на решение (α_i ≠ 0)."},
  {q:"Kernel trick позволяет…",opt:["не считать веса","работать в высокой размерности через K(x,y) без явного φ","ускорить inference","заменить SVM на kNN"],correct:1,explain:"Все вычисления — через скалярные произведения K."}
]
},
{
id:24, block:"D. Классификация и кластеризация", title:"Кластеризация: меры близости",
tldr:"Задача — разбить объекты на группы без меток. Меры близости: евклидова, манхэттенская, минковский, Чебышёва, косинусная, Махаланобиса. Выбор зависит от природы признаков.",
intuition:"Расстояние — это «непохожесть». Евклид — обычная геометрия. Манхэттен — по сетке улиц. Косинус — угол, не модуль (для текстов). Махаланобис — учитывает корреляции и дисперсии (вытянутые распределения).",
viz:{type:"chart",chartType:"distMetrics"},
formulas:[
  {tex:"d_2=\\sqrt{\\sum(x_j-y_j)^2}",explain:"евклидова"},
  {tex:"d_1=\\sum|x_j-y_j|",explain:"манхэттенская"},
  {tex:"d_\\infty=\\max_j|x_j-y_j|",explain:"Чебышёва"},
  {tex:"d_{\\cos}=1-\\frac{x^\\top y}{\\|x\\|\\|y\\|}",explain:"косинусная — на угле"},
  {tex:"d_M=\\sqrt{(x-y)^\\top\\Sigma^{-1}(x-y)}",explain:"Махаланобис — учитывает ковариацию"}
],
pitfalls:[
  "Все метрики на основе нормы требуют масштабирования.",
  "Косинус игнорирует длину вектора — не подходит, если она важна.",
  "Махаланобис требует оценки Σ — нестабилен при d>N.",
  "Категориальные признаки → Hamming, Gower."
],
quiz:[
  {q:"Какая метрика — на угле, не на длине?",opt:["Евклид","Манхэттен","Косинусная","Чебышёв"],correct:2,explain:"d_cos = 1 − cos(x,y), длина не учитывается."},
  {q:"Метрика, эквивалентная max по координатам?",opt:["Манхэттен","Евклид","Чебышёва","Минковский с p=1"],correct:2,explain:"d_∞ = max|x_j − y_j|."},
  {q:"Махаланобис учитывает…",opt:["метки","ковариацию признаков","знаки","масштаб"],correct:1,explain:"Σ⁻¹ корректирует разные дисперсии и корреляции."},
  {q:"TF-IDF документ — какая метрика?",opt:["Евклид","Косинус","Махаланобис","Hamming"],correct:1,explain:"Стандарт в NLP."}
]
},
{
id:25, block:"D. Классификация и кластеризация", title:"K-means",
tldr:"Алгоритм: 1) случайные центры; 2) каждому объекту — ближайший центр; 3) центр = среднее объектов кластера; повторять. Минимизирует суммарную WCSS. K выбирается по elbow или silhouette. Чувствителен к инициализации (k-means++).",
intuition:"Гравитация: точки притягиваются к ближайшему центру масс, центры пересчитываются. За несколько шагов — стабильное разбиение. Минусы: K надо знать, неустойчив к выбросам, любит сферы (евклидова метрика).",
viz:{type:"chart",chartType:"kmeansSteps"},
formulas:[
  {tex:"Q=\\sum_{k=1}^K\\sum_{x\\in C_k}\\|x-\\mu_k\\|^2",explain:"WCSS — то, что минимизируем"},
  {tex:"\\mu_k=\\frac{1}{|C_k|}\\sum_{x\\in C_k}x",explain:"обновление центра"},
  {tex:"s_i=\\frac{b_i-a_i}{\\max(a_i,b_i)}",explain:"Silhouette ∈ [−1,1] — качество кластеризации"}
],
pitfalls:[
  "Локальный минимум — запускай с k-means++ инициализацией и многими стартами.",
  "Не подходит для не-сферических кластеров (используй DBSCAN, GMM).",
  "K — гиперпараметр; ищи по elbow на WCSS или максимуму silhouette.",
  "Чувствителен к масштабу — обязательно scaling.",
  "Чувствителен к выбросам — медианный вариант (k-medians) устойчивее."
],
quiz:[
  {q:"K-means минимизирует…",opt:["энтропию","WCSS","silhouette","расстояние между центрами"],correct:1,explain:"Сумма квадратов расстояний внутри кластеров."},
  {q:"Главная слабость K-means?",opt:["медленный","любит сферы, чувствителен к init","не сходится","нет аналога для регрессии"],correct:1,explain:"Не работает для вытянутых/невыпуклых форм."},
  {q:"K выбирают по…",opt:["загруженности CPU","локтю на WCSS / silhouette","числу признаков","accuracy"],correct:1,explain:"Elbow или максимум silhouette."},
  {q:"k-means++ улучшает…",opt:["скорость","качество начальной инициализации","метрику","scoring"],correct:1,explain:"Распределяет начальные центры подальше друг от друга."}
]
},
{
id:26, block:"D. Классификация и кластеризация", title:"Иерархическая кластеризация и DBSCAN",
tldr:"Иерархическая (agglomerative): каждый объект — кластер, попарно сливаем ближайшие, пока не один. Linkage: single/complete/average/Ward. DBSCAN: ε-окрестность + minPts, выделяет шум, находит произвольные формы.",
intuition:"Иерархическая строит дендрограмму — резать можно на любой высоте, не нужно знать K. DBSCAN: «достаточно густо собрались — кластер; одинокая точка — шум». Идеален для двух полумесяцев, где K-means проваливается.",
viz:{type:"mermaid",code:`graph TD
A[N точек = N кластеров] --> B[Сливаем ближайшие 2]
B --> C[N-1 кластеров]
C --> D[повторяем]
D --> E[1 кластер]
E --> F[Дендрограмма]
F --> G[Режем на нужной высоте]
H[DBSCAN] --> I[epsilon окрестность]
I --> J[minPts соседей?]
J --> K[Core point или Border или Шум]`},
formulas:[
  {tex:"d_{\\text{single}}=\\min_{a\\in A,b\\in B}d(a,b)",explain:"single link"},
  {tex:"d_{\\text{complete}}=\\max d(a,b),\\;d_{\\text{average}}=\\tfrac{1}{|A||B|}\\sum d(a,b)",explain:"complete и average"},
  {tex:"\\text{Ward: }\\min\\Delta\\text{WCSS}",explain:"минимизация роста дисперсии при слиянии"}
],
pitfalls:[
  "Hierarchical: O(N²) память, тяжело при N>10k.",
  "Single link даёт «цепочки» (chaining); complete — компактные кластеры.",
  "DBSCAN: ε и minPts критичны; ε подбирают по k-distance plot.",
  "DBSCAN плохо работает при кластерах разной плотности → HDBSCAN."
],
quiz:[
  {q:"Что НЕ требует знать число кластеров заранее?",opt:["K-means","Hierarchical","DBSCAN","B и C"],correct:3,explain:"И иерархическая, и DBSCAN сами «найдут» нужное число."},
  {q:"DBSCAN относит точку к шуму, если…",opt:["она далеко от центра","в ε нет minPts соседей и она не достижима из core","она первая","по моде"],correct:1,explain:"Не core и не граничная."},
  {q:"Single linkage склонен к…",opt:["компактным кластерам","цепочкам","сферам","шуму"],correct:1,explain:"Достаточно одной близкой пары точек, чтобы слить кластеры."},
  {q:"K-means проваливается на двух полумесяцах. Что подойдёт?",opt:["K-means с другим K","DBSCAN / Spectral / HDBSCAN","Hierarchical Ward","Naive Bayes"],correct:1,explain:"Нужен метод, не предполагающий сферические кластеры."}
]
},
{
id:27, block:"D. Классификация и кластеризация", title:"Кросс-валидация",
tldr:"k-Fold: делим train на k частей, по очереди берём одну как valid. Stratified — сохраняет долю классов. LOOCV (k=N) — дорого, низкий bias, высокая variance. Nested CV — внешний для оценки, внутренний для гиперпараметров.",
intuition:"Один train/test split — это лотерея. CV усредняет качество по нескольким разбиениям → более стабильная оценка. Nested — единственный честный способ одновременно подбирать гиперпараметры и оценивать обобщение.",

C --> L
D --> L
E --> L

  {q:"Дисбаланс классов в CV — нужно…",opt:["больше folds","Stratified","ничего","меньше folds"],correct:1,explain:"Сохраняет долю классов в каждом фолде."},
  {q:"Time series — какой split?",opt:["KFold","StratifiedKFold","TimeSeriesSplit","ShuffleSplit"],correct:2,explain:"Чтобы test всегда был «в будущем» относительно train."},
  {q:"Где хранить scaler?",opt:["вне CV (один раз на всех)","внутри Pipeline в CV","на test","нигде"],correct:1,explain:"Иначе fit на test → data leakage."}

},
{
id:28, block:"D. Классификация и кластеризация", title:"Метрики классификации",
tldr:"Confusion matrix: TP, FP, FN, TN. Accuracy — обманчив при дисбалансе. Precision = TP/(TP+FP) — «не ошибаемся, когда говорим да». Recall = TP/(TP+FN) — «не упускаем». F1 — гармоническое среднее. ROC-AUC, PR-AUC — пороговонезависимые.",
intuition:"Precision = «когда я предсказал спам — это спам?». Recall = «сколько спама я поймал?». Их нельзя максимизировать одновременно — компромисс через threshold. ROC-AUC показывает, насколько модель отделяет классы независимо от порога.",
viz:{type:"chart",chartType:"rocPr"},
formulas:[
  {tex:"P=\\frac{TP}{TP+FP},\\;R=\\frac{TP}{TP+FN}",explain:"precision и recall"},
  {tex:"F_1=\\frac{2PR}{P+R},\\;F_\\beta=(1+\\beta^2)\\frac{PR}{\\beta^2 P+R}",explain:"F1 и F-бета"},
  {tex:"\\text{Accuracy}=\\frac{TP+TN}{N},\\;\\text{Bal.Acc}=\\tfrac{1}{2}(\\text{TPR}+\\text{TNR})",explain:"для дисбаланса лучше balanced"},
  {tex:"\\text{Log-loss}=-\\tfrac{1}{N}\\sum[y\\log p+(1-y)\\log(1-p)]",explain:"оценивает калибровку вероятностей"}
],
pitfalls:[
  "Accuracy при 99/1 дисбалансе → бесполезна.",
  "ROC-AUC при сильном дисбалансе оптимистичен — лучше PR-AUC.",
  "F1 не учитывает TN — несимметричен по классам (используй MCC если важна симметрия).",
  "Threshold подбирай под бизнес-задачу: precision vs recall."
],
quiz:[
  {q:"Цель: не пропустить рак (FN дороже FP). Что максимизируем?",opt:["Precision","Recall","Accuracy","FPR"],correct:1,explain:"Recall = чувствительность, минимизирует FN."},
  {q:"Accuracy=0.99, recall=0.0. Класс редкий?",opt:["нет","да, модель предсказывает только мажоритарный","нормально","ошибка"],correct:1,explain:"Тривиальная модель «всегда нет» при сильном дисбалансе."},
  {q:"ROC-AUC = 0.5 — это…",opt:["идеально","плохо, как монетка","нормально","нельзя интерпретировать"],correct:1,explain:"Случайный классификатор."},
  {q:"PR-AUC лучше ROC-AUC при…",opt:["сбалансированных классах","сильном дисбалансе","малой выборке","большой размерности"],correct:1,explain:"PR-AUC точнее показывает качество на редком положительном классе."}
]
},

{
id:29, block:"E. Ансамбли", title:"Голосование классификаторов",
tldr:"Hard voting — мажоритарное голосование меток. Soft voting — усреднение вероятностей с весами. Работает, если модели независимы и лучше случайной — тогда ансамбль улучшает качество (теорема Кондорсе).",
intuition:"Если 3 врача независимо ставят диагноз, и каждый прав в 70%, то «голосование двух из трёх» даёт ~78%. Чем независимее модели и точнее каждая, тем сильнее эффект. Если модели коррелируют — выигрыш ноль.",
viz:{type:"mermaid",code:`graph LR
X[Объект x] --> M1[Модель 1 - класс A]
X --> M2[Модель 2 - класс A]
X --> M3[Модель 3 - класс B]
M1 --> V[Voting]
M2 --> V
M3 --> V
V --> Y[A]`},
formulas:[
  {tex:"\\hat y_{\\text{hard}}=\\arg\\max_c\\sum_m\\mathbb{1}[a_m(x)=c]",explain:"мажоритарное"},
  {tex:"\\hat y_{\\text{soft}}=\\arg\\max_c\\sum_m w_m p_m(c|x)",explain:"взвешенное среднее вероятностей"}
],
pitfalls:[
  "Hard voting не учитывает уверенность — soft обычно лучше, если модели калиброваны.",
  "Если все модели одинаковые — ансамбль = одна модель.",
  "Слабые модели (хуже монетки) — могут сделать всё ХУЖЕ.",
  "Веса в soft voting подбирай по validation."
],
quiz:[
  {q:"Soft voting лучше hard когда…",opt:["модели некалиброваны","модели выдают калиброванные вероятности","классов 2","нет валидации"],correct:1,explain:"Усреднение вероятностей сохраняет «уверенность»."},
  {q:"Главное условие, чтобы voting улучшал качество?",opt:["модели одинаковые","модели разнообразные и лучше случайной","скорость","малая размерность"],correct:1,explain:"Diversity + точность > 0.5."},
  {q:"Если все 3 модели всегда дают одинаковый ответ — voting…",opt:["лучше всех","= одной модели","хуже","быстрее"],correct:1,explain:"Нет diversity → нет улучшения."}
]
},
{
id:30, block:"E. Ансамбли", title:"Bagging и Random Forest",
tldr:"Bagging = bootstrap aggregating: M моделей на M бутстрэп-выборках, усреднение. Снижает variance. Random Forest = bagging + случайный подбор √d признаков на каждом split. OOB-оценка ≈ бесплатный validation.",
intuition:"Бутстрэп выбирает ~63.2% уникальных объектов в каждую подвыборку (1−1/e). Остальные 36.8% — out-of-bag, на них считаем валидацию без отдельного split. Случайные признаки — для дополнительной decorrelation деревьев.",
viz:{type:"chart",chartType:"baggingOOB"},
formulas:[
  {tex:"P(\\text{в бутстрэп})=1-(1-1/N)^N\\to 1-1/e\\approx 0.632",explain:"вероятность попасть в bootstrap-выборку"},
  {tex:"a_{\\text{bag}}(x)=\\tfrac{1}{M}\\sum_m a_m(x)",explain:"усреднение для регрессии"},
  {tex:"\\text{Var}(\\bar a)=\\rho\\sigma^2+\\frac{1-\\rho}{M}\\sigma^2",explain:"декорреляция (ρ↓) уменьшает variance"}
],
pitfalls:[

id:32, block:"E. Ансамбли", title:"Градиентный бустинг",
tldr:"Каждое дерево обучается предсказывать антиградиент loss относительно текущего ансамбля (псевдоостатки). Для MSE = просто остатки. F_m = F_{m-1} + ν h_m. ν — learning rate. XGBoost / LightGBM / CatBoost — современные реализации.",
intuition:"AdaBoost через изменение весов; GBM через подгонку остатков. Если ансамбль ошибается — обучи дерево, которое предсказывает эту ошибку, и добавь его (с маленьким шагом ν, чтобы не переборщить). Loss любой дифференцируемый.",
viz:{type:"chart",chartType:"gbmResidual"},
formulas:[
  {tex:"r_i^{(m)}=-\\frac{\\partial \\mathcal{L}(y_i,F(x_i))}{\\partial F(x_i)}\\big|_{F=F_{m-1}}",explain:"псевдоостатки — антиградиент"},
  {tex:"\\text{MSE: }r_i=y_i-F_{m-1}(x_i)",explain:"для MSE — обычные остатки"},
  {tex:"F_m=F_{m-1}+\\nu h_m",explain:"shrinkage с learning rate ν"},
  {tex:"\\Omega(h)=\\gamma T+\\tfrac{\\lambda}{2}\\|w\\|^2",explain:"XGBoost: регуляризация дерева"}
],
pitfalls:[

{
id:33, block:"F. Нейронные сети", title:"Модель искусственного нейрона",
tldr:"Нейрон: z = w·x + b → y = φ(z). Предактивация — линейная комбинация входов плюс смещение, затем нелинейность φ. Один нейрон с сигмоидой = логистическая регрессия.",
intuition:"Нейрон — обобщение линейной модели: вход умножается на веса, складывается, проходит через нелинейную функцию. Без нелинейности любая глубина схлопывается в одну линейку. Bias — свободный сдвиг гиперплоскости решения.",
viz:{type:"mermaid",code:`graph LR

X2[x_2] -->|w_2| S

B[b] --> S
S --> A[phi z]
A --> Y[y]`},

  {tex:"H(d+1)\\;\\text{параметров на слой H нейронов}",explain:"+1 — это bias на каждый нейрон"}
],

  "Активации должны быть дифференцируемы (для backprop).",

]

{
id:34, block:"F. Нейронные сети", title:"Функции активации",
tldr:"Sigmoid σ(z) — гладкая, [0,1], насыщается. Tanh — [−1,1], симметрично. ReLU — max(0,z) — стандарт скрытых слоёв, не насыщается, дешёвая, но «умирает» при z<0. Leaky ReLU / ELU / GELU решают проблему мёртвых нейронов. Softmax — для выходов многоклассовой классификации.",
intuition:"Активация решает: «разрешить ли сигналу пройти и насколько». Современный стандарт — ReLU и её варианты: производная либо 1, либо 0, никаких затухающих градиентов. Sigmoid и tanh насыщаются по краям, градиент → 0, обучение глубоких сетей замирает (vanishing gradient).",
viz:{type:"chart",chartType:"activations"},
formulas:[
  {tex:"\\sigma(z)=\\frac{1}{1+e^{-z}},\\;\\sigma'(z)=\\sigma(z)(1-\\sigma(z))",explain:"сигмоида"},
  {tex:"\\tanh(z)=\\frac{e^z-e^{-z}}{e^z+e^{-z}},\\;\\tanh'(z)=1-\\tanh^2 z",explain:"tanh"},
  {tex:"\\text{ReLU}(z)=\\max(0,z),\\;\\text{ReLU}'=\\mathbb{1}[z>0]",explain:"ReLU — стандарт скрытых слоёв"},
  {tex:"\\text{softmax}(z)_k=\\frac{e^{z_k}}{\\sum_j e^{z_j}}",explain:"softmax — многоклассовый выход"}
],
pitfalls:[
  "Sigmoid в скрытых слоях глубоких сетей → vanishing gradient.",
  "ReLU dying: если z<0 для всего батча, нейрон мёртв навсегда → Leaky ReLU.",
  "Softmax + cross-entropy численно: используй log-sum-exp trick.",
  "Не путай: на выходе бинарной классификации — sigmoid, на многоклассе — softmax."
],
quiz:[
  {q:"Стандарт скрытых слоёв в современных DL?",opt:["sigmoid","tanh","ReLU и её варианты","softmax"],correct:2,explain:"ReLU — дешёвая, не насыщается с положительной стороны."},
  {q:"Vanishing gradient в sigmoid возникает потому что…",opt:["плохая инициализация","|σ′| ≤ 0.25 и быстро падает","неправильный loss","нет batchnorm"],correct:1,explain:"При насыщении σ′ → 0; в глубокой сети произведение → 0."},
  {q:"Dying ReLU решается через…",opt:["BatchNorm","Leaky ReLU / ELU","больший lr","меньший batch"],correct:1,explain:"Leaky ReLU имеет небольшой наклон при z<0 → нейрон не умирает."},
  {q:"Softmax — это…",opt:["для бинарной классификации","для многоклассовой — нормирует логиты в распределение","всегда лучше sigmoid","для регрессии"],correct:1,explain:"Σ p_k = 1, max выделяется."}
]
},
{
id:35, block:"F. Нейронные сети", title:"Инициализация весов",
tldr:"LeCun (Var = 1/n_in) — для tanh/sigmoid. Xavier/Glorot (Var = 2/(n_in+n_out)) — для tanh/sigmoid с балансом. He/Kaiming (Var = 2/n_in) — для ReLU. Bias обычно 0. Цель: дисперсии активаций и градиентов не взрываются и не схлопываются по слоям.",
intuition:"Если все веса нули — все нейроны в слое идентичны (нет diversity). Слишком большие — активации взрываются. Слишком маленькие — затухают, градиенты исчезают. Правильная инициализация поддерживает «здоровое» распределение сигнала по слоям.",
viz:{type:"chart",chartType:"initVariance"},
formulas:[
  {tex:"\\text{LeCun: }\\text{Var}(W)=1/n_{\\text{in}}",explain:"для линейных активаций / tanh"},
  {tex:"\\text{Xavier/Glorot: }\\text{Var}(W)=\\frac{2}{n_{\\text{in}}+n_{\\text{out}}}",explain:"для tanh, симметрично"},
  {tex:"\\text{He: }\\text{Var}(W)=2/n_{\\text{in}}",explain:"для ReLU — компенсирует обнуление половины"}
],
pitfalls:[
  "Никогда не инициализируй W нулями — нет symmetry breaking.",
  "Слишком большой scale → exploding gradients.",
  "Для ReLU использовать Xavier — не оптимально (надо He).",
  "Bias=0 норма; иногда small positive bias для ReLU чтобы разбудить нейроны."
],
quiz:[

  {q:"Если W=0 для всех…",opt:["сеть учится","все нейроны одинаковы — нет diversity","быстрее","меньше памяти"],correct:1,explain:"Symmetry breaking ломается."},
  {q:"Цель инициализации?",opt:["скорость","дисперсия активаций/градиентов стабильна по глубине","меньше памяти","точность"],correct:1,explain:"Если Var съезжает по слоям — обучение разваливается."},
  {q:"Xavier — для…",opt:["ReLU","tanh / sigmoid","softmax","Adam"],correct:1,explain:"Симметричные активации с производной около 0 в нуле."}
]

tldr:"MLP = последовательность полносвязных слоёв с нелинейностями. Универсальная теорема: с одним достаточно широким скрытым слоем MLP может приблизить любую непрерывную функцию. На практике глубже = эффективнее по параметрам.",
intuition:"Каждый слой — нелинейное преобразование пространства. Чем глубже, тем абстрактнее представления. Один скрытый слой теоретически универсален, но требует огромного числа нейронов; глубокая сеть достигает того же меньшим числом параметров.",

{
id:37, block:"F. Нейронные сети", title:"Backpropagation",
tldr:"Алгоритм обратного распространения ошибки: chain rule по графу вычислений. Forward пасс — считаем активации; backward — градиенты от выхода ко входу: δ^(l-1) = (W^(l))^T δ^(l) ⊙ φ'(z^(l-1)).",
intuition:"Чтобы понять, как изменить вес w, надо знать «насколько loss зависит от него». Это chain rule: производная loss по w = производная по выходу × производная выхода по w. Backprop эффективно считает все градиенты за один обратный проход.",
viz:{type:"mermaid",code:`graph LR
X[x] --> Z1[z1=W1 x+b1] --> H1[h1=phi z1] --> Z2[z2=W2 h1+b2] --> Y[y_hat=phi z2]
Y --> L[Loss]
L -.dL/dy_hat.-> Y
Y -.dL/dz2.-> Z2
Z2 -.dL/dW2.-> Z2
Z2 -.dL/dh1.-> H1
H1 -.dL/dz1.-> Z1
Z1 -.dL/dW1.-> Z1`},
formulas:[
  {tex:"\\delta^{(L)}=\\hat y-y\\;\\text{(softmax+CE или sigmoid+BCE или MSE+linear)}",explain:"красивое совпадение градиента на выходе"},
  {tex:"\\delta^{(l-1)}=(W^{(l)})^\\top \\delta^{(l)}\\odot\\varphi'(z^{(l-1)})",explain:"рекурсия в backward"},
  {tex:"\\frac{\\partial \\mathcal{L}}{\\partial W^{(l)}}=\\delta^{(l)} (h^{(l-1)})^\\top",explain:"градиент по весам слоя"},
  {tex:"\\theta\\leftarrow\\theta-\\eta\\nabla\\mathcal{L}",explain:"шаг градиентного спуска"}
],
pitfalls:[
  "Vanishing gradient: при глубине градиенты убывают по слоям → лечится ReLU, BatchNorm, residual.",

  "Не забывай нулить градиенты между батчами (PyTorch: optimizer.zero_grad()).",
  "Numerical: log/exp в loss требуют trick'ов (log-sum-exp, label smoothing)."
],
quiz:[
  {q:"Backprop — это применение…",opt:["МНК","chain rule","SGD","Newton method"],correct:1,explain:"Цепное правило по вычислительному графу."},
  {q:"Vanishing gradient лечится…",opt:["ReLU, BN, residual connections","увеличением lr","удалением слоёв","без активаций"],correct:0,explain:"Сохраняем градиенты живыми по глубине."},
  {q:"δ^(L) для softmax + cross-entropy =",opt:["y","ŷ - y","-(y - ŷ)²","σ(z)"],correct:1,explain:"Красивое совпадение из-за дифференцирования softmax-CE."},
  {q:"Почему PyTorch требует zero_grad()?",opt:["для скорости","градиенты накапливаются по умолчанию","для регуляризации","для безопасности"],correct:1,explain:"Иначе .backward() добавляет к старому градиенту."}
]
},
{
